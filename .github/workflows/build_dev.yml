# This is a basic workflow to help you get started with Actions

name: Build image on DEV branch

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    branches: [ "dev" ]

  push:
    branches: [ "dev" ]

  # Rebuild the current dev HEAD on demand, without having to invent a commit
  # whose message carries the magic marker.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy-dev:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment:
      # `develop`, not `development`. The VCR_DEV_REGISTRY variable and the two
      # VCR_DEV_USERNAME/PASSWORD secrets live in the environment named
      # `develop`, matching the vngcloud-manage-csi-driver convention. The
      # workflow used to point at `development` - an empty environment - so
      # REGISTRY resolved to an empty string and docker build failed with
      # "invalid reference format".
      name: develop
    # Build on an explicit [build] marker, on any merge into dev, or on demand.
    #
    # The previous condition closed its bracket in the wrong place:
    #
    #   contains(msg, '[build]' || contains(msg, 'Merge branch'))
    #
    # so the second argument was the expression `'[build]' || contains(...)`.
    # A non-empty string is truthy and `||` yields the first truthy operand, so
    # the whole thing collapsed to contains(msg, '[build]') and the merge branch
    # was dead code - every build_dev run that ever succeeded had [build] in its
    # message. Merges into dev, the case the author meant to cover, were skipped
    # silently: a merged PR produced no image and nothing said so.
    #
    # 'Merge pull request' is what the GitHub merge button writes; 'Merge
    # branch' is what a local merge writes. Cover both.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]') ||
      startsWith(github.event.head_commit.message, 'Merge pull request') ||
      startsWith(github.event.head_commit.message, 'Merge branch')
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Notifications are auxiliary. The telegram step used to come FIRST and
      # unguarded: missing TELEGRAM_TO/TELEGRAM_TOKEN killed the job right
      # there, every remaining step was skipped and no image was ever built.
      - name: Check notification config
        id: tg
        run: |
          if [ -n '${{ secrets.TELEGRAM_TOKEN }}' ] && [ -n '${{ secrets.TELEGRAM_TO }}' ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TELEGRAM_TO / TELEGRAM_TOKEN not set, skipping notifications."
          fi

      - name: Send alert that a new commit has been created
        if: steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 *NEW COMMIT*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: Building `vngcloud-blockstorage-csi-driver` image
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          ref: dev

      # The image tag is also the VERSION injected into ldflags:
      #   Makefile:40  -X k8s.io/component-base/version.gitVersion=$(VERSION)
      # component-base parses that string with ^v(\d+\.\d+\.\d+) inside the
      # package init() of legacyregistry and PANICS on a mismatch - before
      # main(), where nothing can recover. The tag MUST start with vN.N.N; the
      # regex is not end-anchored, so the suffix is free.
      #
      # Previously the tag was a hardcoded "v0.0.0" for EVERY dev build: no way
      # to tell which commit an image came from, no way to roll back.
      - id: tag
        run: echo "tag=v0.0.0-dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # REGISTRY must be passed in: the Makefile defaults to
      # REGISTRY ?= vcr.vngcloud.vn/60108-cuongdm3 (a personal namespace), so
      # leaving it unset makes the build tag the image there while the push
      # step pushes to VCR_DEV_REGISTRY - two different paths, and the thing
      # being pushed was never built.
      #
      # continue-on-error removed: a broken build carrying on into the push
      # only surfaces the failure one step away from its real cause.
      # Report a clear error instead of letting docker fail with
      # "invalid reference format" when REGISTRY is empty.
      - name: Verify registry config
        run: |
          if [ -z '${{ vars.VCR_DEV_REGISTRY }}' ]; then
            echo "::error::VCR_DEV_REGISTRY is empty in environment 'develop'. Set it in Settings -> Environments -> develop."
            exit 1
          fi
          if [ -z '${{ secrets.VCR_DEV_USERNAME }}' ] || [ -z '${{ secrets.VCR_DEV_PASSWORD }}' ]; then
            echo "::error::Missing secret VCR_DEV_USERNAME / VCR_DEV_PASSWORD in environment 'develop'."
            exit 1
          fi
          echo "Registry: ${{ vars.VCR_DEV_REGISTRY }}"

      - name: Containerize the application
        env:
          REGISTRY: ${{ vars.VCR_DEV_REGISTRY }}
          VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          make build-local-images
      - name: Send alert that the image has been built failed
        if: failure() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ⛔ *ERROR*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: Failed to build `vngcloud-blockstorage-csi-driver` image
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Send alert that the image has been built success
        if: success() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            📦 *SUCCESS*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: The `vngcloud-blockstorage-csi-driver:${{ steps.tag.outputs.tag }}` image is built successfully, try to push it to VngCloud Registry
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Login to vcr.vngcloud.vn
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.VCR_DEV_REGISTRY }}
          username: ${{ secrets.VCR_DEV_USERNAME }}
          password: ${{ secrets.VCR_DEV_PASSWORD }}
      - name: Push to vcr.vngcloud.vn
        run: |
          docker image push ${{ vars.VCR_DEV_REGISTRY }}/vngcloud-blockstorage-csi-driver:${{ steps.tag.outputs.tag }}
      - name: Send alert that the image has been pushed failed
        if: failure() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ⛔ *ERROR*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: Failed to PUSH `vngcloud-blockstorage-csi-driver` image to VngCloud registry
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Send alert that the image has been pushed success
        if: success() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🛸 *SUCCESS*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: The `vngcloud-blockstorage-csi-driver:${{ steps.tag.outputs.tag }}` image is pushed successfully to VngCloud registry
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
