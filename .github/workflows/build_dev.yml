# This is a basic workflow to help you get started with Actions

name: Build image on DEV branch

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    branches: [ "dev" ]

  push:
    branches: [ "dev" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy-dev:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment:
      name: development  # Set the environment name
    # Only trigger the workflow if the commit message contains '[build]'
    if: contains(github.event.head_commit.message, '[build]' || contains(github.event.head_commit.message, 'Merge branch'))
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Thong bao la phu tro. Truoc day buoc telegram nam DAU TIEN va khong duoc
      # bao ve: thieu TELEGRAM_TO/TELEGRAM_TOKEN la job chet ngay tu day, moi
      # buoc con lai bi skip va khong co anh nao duoc build.
      - name: Check notification config
        id: tg
        run: |
          if [ -n '${{ secrets.TELEGRAM_TOKEN }}' ] && [ -n '${{ secrets.TELEGRAM_TO }}' ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TELEGRAM_TO / TELEGRAM_TOKEN chua duoc dat, bo qua thong bao."
          fi

      - name: Send alert that a new commit has been created
        if: steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🚀 *NEW COMMIT*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: Building `vngcloud-blockstorage-csi-driver` image
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          ref: dev

      # Tag anh cung chinh la VERSION nhet vao ldflags:
      #   Makefile:40  -X k8s.io/component-base/version.gitVersion=$(VERSION)
      # component-base parse chuoi do bang regex ^v(\d+\.\d+\.\d+) ngay trong
      # init() cua legacyregistry va PANIC neu khong khop - truoc ca main(), nen
      # khong bat duoc. Tag bat buoc mo dau bang vN.N.N; regex khong neo cuoi nen
      # hau to tu do.
      #
      # Truoc day tag la "v0.0.0" cung nhac cho MOI ban build dev: khong the biet
      # mot anh den tu commit nao, va khong the rollback ve ban truoc.
      - id: tag
        run: echo "tag=v0.0.0-dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Runs a set of commands using the runners shell
      #
      # REGISTRY phai duoc truyen vao: Makefile mac dinh
      # REGISTRY ?= vcr.vngcloud.vn/60108-cuongdm3 (mot namespace ca nhan), nen
      # neu bo trong thi buoc build tag anh vao do con buoc push lai day len
      # VCR_DEV_REGISTRY - hai duong dan khac nhau, va cai duoc push chua tung
      # duoc build.
      #
      # continue-on-error da bo: build hong ma van chay tiep sang push chi lam
      # buoc push that bai xa hon nguyen nhan that.
      - name: Containerize the application
        env:
          REGISTRY: ${{ vars.VCR_DEV_REGISTRY }}
          VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          make build-local-images
      - name: Send alert that the image has been built failed
        if: failure() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ⛔ *ERROR*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: Failed to build `vngcloud-blockstorage-csi-driver` image
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Send alert that the image has been built success
        if: success() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            📦 *SUCCESS*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: The `vngcloud-blockstorage-csi-driver:${{ steps.tag.outputs.tag }}` image is built successfully, try to push it to VngCloud Registry
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Login to vcr.vngcloud.vn
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.VCR_DEV_REGISTRY }}
          username: ${{ secrets.VCR_DEV_USERNAME }}
          password: ${{ secrets.VCR_DEV_PASSWORD }}
      - name: Push to vcr.vngcloud.vn
        run: |
          docker image push ${{ vars.VCR_DEV_REGISTRY }}/vngcloud-blockstorage-csi-driver:${{ steps.tag.outputs.tag }}
      - name: Send alert that the image has been pushed failed
        if: failure() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ⛔ *ERROR*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: Failed to PUSH `vngcloud-blockstorage-csi-driver` image to VngCloud registry
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Send alert that the image has been pushed success
        if: success() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🛸 *SUCCESS*
            *Repository*: `${{ github.repository }}`
            *Author*: `${{ github.actor }}`
            *Action*: The `vngcloud-blockstorage-csi-driver:${{ steps.tag.outputs.tag }}` image is pushed successfully to VngCloud registry
            *Commit message*:
            ```
            ${{ github.event.commits[0].message }}
            ```
            *See changes*: https://github.com/${{ github.repository }}/commit/${{github.sha}}
            *See workflow*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
