name: Release vngcloud-blockstorage-csi-driver project

on:
  push:
    tags:
      - 'v*'
  pull_request:
    tags:
      - 'v*'

jobs:
  build:
    name: GoReleaser build
    runs-on: ubuntu-latest
    # GO_RELEASER_GITHUB_TOKEN lives in the `production` environment, alongside
    # the registry credentials build_prod.yml uses. A job that declares no
    # environment sees only repository- and organization-level secrets, so
    # without this line the token resolves to an empty string and GoReleaser
    # exits with "missing GITHUB_TOKEN" before doing any work.
    #
    # That is exactly what happened on the v1.5.0 and v1.5.1 tags: both runs
    # failed after ~20s at the env step, having built nothing.
    #
    # Note this also puts releases behind whatever protection rules the
    # `production` environment carries - a required reviewer there means every
    # tag push waits for an approval.
    environment: production
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # See: https://goreleaser.com/ci/actions/

      - name: Set up Go 1.22
        uses: actions/setup-go@v4
        with:
          go-version: 1.22
        id: go

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --rm-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GO_RELEASER_GITHUB_TOKEN }}