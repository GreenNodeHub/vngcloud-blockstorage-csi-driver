name: CI

# The single branch-protection gate is the "CI OK" job — checks can be added or
# removed without touching protection settings.
#
# This repo keeps its existing build_dev.yml / build_prod.yml / release.yml for
# deployment; ci.yml is only the quality gate for PRs into main.
#
# UNLIKE control-plane: blockstorage-csi needs no github token for private
# modules — both deps (vngcloud-go-sdk, vngcloud-csi-volume-modifier) are public
# and on the Go proxy, so go build/vet/test resolve without GOPRIVATE/auth.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify build compiles
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # blockstorage-csi uses make unit (which filters sanity/tests packages via
      # sed) instead of raw go test ./... — avoids building test binaries for
      # packages needing external deps.
      - name: Run tests
        run: make unit

  lint:
    # PR-only: only-new-issues diffs against the PR's merge-base — this repo
    # carries many pre-existing issues, the gate only blocks NEW code.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint (new issues only)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2 # pinned to the first green run (2026-07-29)
          only-new-issues: true

  ci-ok:
    name: CI OK
    # lint runs on pull_request only — a "skipped" result on push is fine;
    # fail only on an actual failure/cancelled job.
    needs: [build, test, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify no required job failed
        run: |
          echo '${{ toJson(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            || { echo "::error::A required CI job failed or was cancelled."; exit 1; }
