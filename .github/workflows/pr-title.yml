name: PR title

# Enforce Conventional Commits on the PR title. With squash merge, the PR
# title becomes the commit message on main — release tooling and the CHANGELOG
# depend on it being machine-readable.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            perf
            style
            revert
            build
          requireScope: false
